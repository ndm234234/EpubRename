const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

// neighbour's blob (broken images). Keep the list aligned: a missing file keeps its own path.

  if (!orig) return;

          return all;

const THEME_CSS = {
  light: { "body.light": { color: "#1d1d1f", background: "#fdfcf8" } },
  sepia: { "body.sepia": { color: "#3b2f1e !important", background: "#f4ecd8 !important" },
           "body.sepia *": { color: "inherit !important", "background-color": "transparent !important" } },
  dark:  { "body.dark": { color: "#d8d8dc !important", background: "#161618 !important" },
           "body.dark *": { color: "inherit !important", "background-color": "transparent !important" },
           "body.dark a, body.dark a *": { color: "#6ea0ff !important" } },
};
const prefs = Object.assign({ theme: "light", font: 100 }, store.get("epubReader:prefs"));
const savePrefs = () => store.set("epubReader:prefs", prefs);
document.documentElement.dataset.theme = prefs.theme;

let book = null, rendition = null, bookKey = "", tocItems = [];
let locationsReady = false;   // positions for the whole book are computed (see prepareLocations)
let marksKey = "", marks = [];   // bookmarks of the open book: [{cfi, text, name, time}]

// ------------------------------------------------------------ opening a book

// From the catalog: reader.html#book=<epub url relative to this page>
const params = new URLSearchParams(location.hash.slice(1));
const src = params.get("book");
if (src) {
  $("back").classList.remove("hidden");
  openFromUrl(src);
}

async function openFromUrl(url) {
  const name = decodeURIComponent(url.split("/").pop());
  $("startTitle").textContent = name;
  $("startText").textContent = "Opening…";
  $("pickBtn").classList.add("hidden");
  const bookUrl = new URL(url, location.href);
  let error = "";
  if (bookUrl.protocol !== "file:") {
    try {
      const r = await fetch(bookUrl);
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      return openBook(await r.arrayBuffer(), name);
    } catch (e) { error = e.message; }
  }
  // Opened from disk (file://): the browser doesn't let a page read files by itself
  $("startTitle").textContent = name;
  $("startText").textContent = "Can't open the book automatically" + (error ? ` (${error})` : "") +
    ". Choose the file (or drop it here).";
  if (bookUrl.protocol === "file:") {
    $("startText").textContent = "The browser doesn't let a page opened from disk open books by itself. " +
      "Choose the file (or drop it here).";
    $("startHint").innerHTML = "For one-click reading open the catalog with <b>Open Library</b> " +
      "(<code>Open Library.bat</code> on Windows, <code>Open Library.sh</code> on Linux) " +
      "in the folder with index.html.";
  }
  $("pickBtn").textContent = "Choose “" + name + "”…";
  $("pickBtn").classList.remove("hidden");
}

function openFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => openBook(reader.result, file.name);
  reader.readAsArrayBuffer(file);
}

async function openBook(data, fileName) {
  locationsReady = false;
  if (book) { clearSearch(); toggleSearch(false); toggleMarks(false); book.destroy(); $("viewer").replaceChildren(); }
  $("startTitle").textContent = fileName;
  $("startText").textContent = "Opening…";
  $("pickBtn").classList.add("hidden");
  $("startHint").textContent = "";
  try {
    book = ePub(data);
    await book.ready;
  } catch (e) {
    $("startTitle").textContent = "Can't open " + fileName;
    $("startText").textContent = String(e && e.message || e);
    $("pickBtn").textContent = "Choose another file…";
    $("pickBtn").classList.remove("hidden");
    return;
  }
  const md = book.packaging.metadata;
  // The same book gets the same key whether opened from the catalog or picked by hand
  bookKey = "epubReader:book:" + (md.identifier || md.title || fileName);
  marksKey = "epubReader:marks:" + (md.identifier || md.title || fileName);
  marks = store.get(marksKey) || [];
  $("marksBtn").disabled = !marks.length;
  document.title = md.title || fileName;
  $("title").textContent = [md.title || fileName, md.creator].filter(Boolean).join(" — ");

  rendition = book.renderTo("viewer", { width: "100%", height: "100%", spread: "auto",
                                        allowScriptedContent: false });
  for (const t of THEMES) rendition.themes.register(t, THEME_CSS[t]);
  rendition.themes.select(prefs.theme);
  rendition.themes.fontSize(prefs.font + "%");
  rendition.on("relocated", onRelocated);
  rendition.on("keydown", onKey);
  rendition.on("touchstart", e => touchX = e.changedTouches[0].screenX);
  rendition.on("touchend", e => {
    const dx = e.changedTouches[0].screenX - touchX;
    if (Math.abs(dx) > 50) dx < 0 ? rendition.next() : rendition.prev();
  });

  const saved = store.get(bookKey);
  try { await rendition.display(saved && saved.cfi || undefined); }
  catch { await rendition.display(); }   // saved place is no longer valid
  $("start").classList.add("hidden");
  for (const id of ["prev", "next", "smaller", "bigger", "searchBtn", "markBtn"]) $(id).disabled = false;

  book.loaded.navigation.then(nav => {
    tocItems = [];
    $("toc").replaceChildren(buildToc(nav.toc));
    $("tocBtn").disabled = !tocItems.length;
    markCurrent();
    renderMarks();   // chapter names are known now
  });
  prepareLocations(book, md.identifier || md.title || fileName);
}

// ------------------------------------------------------------ positions across the book

// The slider and all % need positions for the WHOLE book. epub.js fills them in gradually
// (a big book takes a minute or more), so until generate() finishes they must not be used:
// a half-filled list gives wrong % and sends the slider to wrong places.
// Finished positions are cached, so the next opening of the book is instant.
const LOC_CHARS = 1600;
const LOC_PREFIX = "epubReader:loc:";
const LOC_CACHE_MAX = 2_000_000;   // characters in localStorage for all cached books together

function locKey(id) { return LOC_PREFIX + LOC_CHARS + ":" + book.spine.spineItems.length + ":" + id; }

function loadCachedLocations(key) {
  try {
    const json = localStorage.getItem(key);
    if (!json) return false;
    book.locations.load(json);
    if (!book.locations.length()) return false;
    store.set(LOC_PREFIX + "used:" + key, Date.now());   // for "least recently used" cleanup
    return true;
  } catch { return false; }
}

function saveLocations(key) {
  try {
    const json = book.locations.save();
    if (json.length > LOC_CACHE_MAX) return;
    // Drop the least recently used cached books until this one fits
    const cached = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(LOC_PREFIX) && !k.startsWith(LOC_PREFIX + "used:") && k !== key)
        cached.push({ k, size: (localStorage.getItem(k) || "").length, used: store.get(LOC_PREFIX + "used:" + k) || 0 });
    }
    cached.sort((a, b) => a.used - b.used);
    let total = cached.reduce((n, c) => n + c.size, 0) + json.length;
    while (total > LOC_CACHE_MAX && cached.length) {
      const c = cached.shift();
      localStorage.removeItem(c.k); localStorage.removeItem(LOC_PREFIX + "used:" + c.k);
      total -= c.size;
    }
    localStorage.setItem(key, json);
    store.set(LOC_PREFIX + "used:" + key, Date.now());
  } catch {}   // storage full or blocked: it will just be computed again next time
}

function showNavLoading(on, frac = 0) {
  $("seek").classList.toggle("hidden", on);
  $("navLoad").classList.toggle("hidden", !on);
  if (!on) return;
  const p = Math.max(2, Math.min(99, Math.round(frac * 100)));
  $("navTrack").style.setProperty("--p", p + "%");
  $("navLoad").setAttribute("aria-valuenow", p);
  $("navPct").textContent = p + "%";
  $("pct").textContent = "";
}

// How far generate() has got: the section of the last position found so far
function locationsProgress(b) {
  const list = b.locations._locations || [];
  if (!list.length) return 0;
  try { return (new ePub.CFI(list[list.length - 1]).spinePos + 1) / b.spine.spineItems.length; }
  catch { return 0; }
}

function prepareLocations(b, id) {
  locationsReady = false;
  const key = locKey(id);
  const done = () => {
    if (b !== book) return;   // another book was opened meanwhile
    locationsReady = true;
    showNavLoading(false);
    onRelocated(rendition.currentLocation());
    renderMarks();
    if (hits.length) for (const h of hits) h.a.querySelector("small").textContent =
      Math.round(book.locations.percentageFromCfi(h.cfi) * 100) + "%";
  };
  if (loadCachedLocations(key)) return done();
  showNavLoading(true, 0);
  const timer = setInterval(() => {
    if (b !== book || locationsReady) return clearInterval(timer);
    showNavLoading(true, locationsProgress(b));
  }, 500);
  b.locations.generate(LOC_CHARS).then(() => {
    clearInterval(timer);
    if (b !== book) return;
    saveLocations(key);
    done();
  });
}

// ------------------------------------------------------------ table of contents

function buildToc(items) {
  const ul = document.createElement("ul");
  for (const item of items) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.textContent = item.label.trim();
    a.href = "#";
    a.onclick = e => {
      e.preventDefault();
      toggleToc(false);
      rendition.display(item.href).catch(() => rendition.display(item.href.split("#")[0]));
    };
    tocItems.push({ a, href: item.href.split("#")[0] });
    li.append(a);
    if (item.subitems && item.subitems.length) li.append(buildToc(item.subitems));
    ul.append(li);
  }
  return ul;
}

const sameFile = (a, b) => a && b && (a === b || a.endsWith("/" + b) || b.endsWith("/" + a));

function markCurrent() {
  const loc = rendition && rendition.currentLocation();
  const href = loc && loc.start && loc.start.href;
  let current = null;
  for (const t of tocItems) {
    t.a.classList.remove("current");
    if (!current && sameFile(t.href, href)) current = t;
  }
  if (current) current.a.classList.add("current");
  $("chapter").textContent = current ? current.a.textContent : "";
}

function toggleToc(open = !$("toc").classList.contains("open")) {
  $("toc").classList.toggle("open", open);
  $("tocBtn").classList.toggle("active", open);
  if (open) {
    const cur = $("toc").querySelector(".current");
    if (cur) cur.scrollIntoView({ block: "center" });
  }
}

// ------------------------------------------------------------ position & progress

function onRelocated(loc) {
  if (!loc || !loc.start) return;
  const pct = locationsReady ? book.locations.percentageFromCfi(loc.start.cfi) : null;
  store.set(bookKey, { cfi: loc.start.cfi, pct, title: document.title, time: Date.now() });
  const d = loc.start.displayed;
  $("where").textContent = d && d.total ? `page ${d.page} of ${d.total} in chapter` : "";
  if (locationsReady) $("pct").textContent = Math.round(pct * 100) + "%";   // else: progress text
  if (pct != null && !seeking) setSeek(pct);
  $("seek").disabled = pct == null;   // enabled once page positions are computed
  $("prev").disabled = !!loc.atStart;
  $("next").disabled = !!loc.atEnd;
  markCurrent();
  updateMarkUi();
}

// Slider: drag to preview where you'll land, release to go there
let seeking = false;
function setSeek(frac) {
  $("seek").value = Math.round(frac * 1000);
  $("seek").style.setProperty("--p", (frac * 100).toFixed(1) + "%");
}
function chapterAt(cfi) {
  const item = book.spine.get(cfi);
  const t = item && tocItems.find(t => sameFile(t.href, item.href));
  return t ? t.a.textContent : "";
}
$("seek").addEventListener("input", () => {
  seeking = true;
  const frac = $("seek").value / 1000;
  setSeek(frac);
  const ch = chapterAt(book.locations.cfiFromPercentage(frac));
  $("where").textContent = "→ " + Math.round(frac * 100) + "%" + (ch ? " · " + ch : "");
});
$("seek").addEventListener("change", () => {
  const frac = $("seek").value / 1000;
  rendition.display(book.locations.cfiFromPercentage(frac)).finally(() => { seeking = false; });
});

// ------------------------------------------------------------ search in the book

// Matching ignores case, treats ё as е and any run of whitespace as one space.
// Text is searched across tags (a phrase may span <i>, <b>, …); a paragraph break counts as a space.
const BLOCK_TAGS = new Set(["P", "DIV", "H1", "H2", "H3", "H4", "H5", "H6", "LI", "DT", "DD", "TD", "TH",
  "BLOCKQUOTE", "PRE", "SECTION", "ARTICLE", "ASIDE", "HEADER", "FOOTER", "FIGCAPTION", "TR", "BODY",
  "p", "div", "h1", "h2", "h3", "h4", "h5", "h6", "li", "dt", "dd", "td", "th",
  "blockquote", "pre", "section", "article", "aside", "header", "footer", "figcaption", "tr", "body"]);
const MAX_HITS = 2000;
const HL_STYLE = { fill: "#ffd54a", "fill-opacity": "0.45", "mix-blend-mode": "multiply" };
const HL_CURRENT = { fill: "#ff8a00", "fill-opacity": "0.55", "mix-blend-mode": "multiply" };

function normChar(c) {
  if (/\s/.test(c)) return " ";
  const l = c.toLowerCase();
  if (l.length !== 1) return c;
  return l === "ё" ? "е" : l;
}
const normQuery = s => Array.from(s.trim(), normChar).join("").replace(/ +/g, " ");

function blockOf(node) {
  for (let n = node.parentNode; n; n = n.parentNode) if (BLOCK_TAGS.has(n.nodeName)) return n;
  return null;
}

// Flatten a chapter into one normalized string (+ the same text as written, for snippets);
// pos[i] = [text node, offset] of each character
function flatten(doc) {
  const body = doc.body || doc.getElementsByTagName("body")[0] || doc.documentElement;
  const walker = doc.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  let text = "", orig = "", lastBlock = null;
  const pos = [];
  for (let node; (node = walker.nextNode()); ) {
    const p = node.parentNode && node.parentNode.nodeName.toLowerCase();
    if (p === "script" || p === "style") continue;
    const block = blockOf(node);
    if (block !== lastBlock && text && !text.endsWith(" ")) {   // paragraph break = a space
      text += " "; orig += " ";
      pos.push(pos[pos.length - 1]);
    }
    lastBlock = block;
    const s = node.nodeValue;
    for (let i = 0; i < s.length; i++) {
      const c = normChar(s[i]);
      if (c === " " && (text.endsWith(" ") || !text)) continue;
      text += c; orig += c === " " ? " " : s[i];
      pos.push([node, i]);
    }
  }
  return { text, orig, pos };
}

function snippet(text, at, len) {
  const R = 45;
  let a = Math.max(0, at - R), b = Math.min(text.length, at + len + R);
  if (a > 0) a = text.indexOf(" ", a) + 1 || a;             // don't cut words
  if (b < text.length) b = text.lastIndexOf(" ", b) > at + len ? text.lastIndexOf(" ", b) : b;
  return [(a > 0 ? "…" : "") + text.slice(a, at), text.slice(at, at + len),
          text.slice(at + len, b) + (b < text.length ? "…" : "")];
}

let hits = [], hitIdx = -1, searchRun = 0, lastQuery = "";

function sectionLabel(section) {
  const t = tocItems.find(t => sameFile(t.href, section.href));
  return t ? t.a.textContent : "Section " + (section.index + 1);
}

async function runSearch(raw) {
  const query = normQuery(raw);
  if (!book || query === lastQuery && hits.length) return;
  clearSearch(false);
  lastQuery = query;
  if (!query) return;
  const run = ++searchRun;
  const sections = book.spine.spineItems.filter(s => s.linear !== false);
  let truncated = false;
  for (let si = 0; si < sections.length && !truncated; si++) {
    if (run !== searchRun) return;   // a newer search has started
    $("searchStatus").textContent = `Searching… ${Math.round(si / sections.length * 100)}%`;
    const section = sections[si];
    let found = [];
    try {
      await section.load(book.load.bind(book));
      const { text, orig, pos } = flatten(section.document);
      for (let at = text.indexOf(query); at !== -1; at = text.indexOf(query, at + query.length)) {
        const [sn, so] = pos[at], [en, eo] = pos[at + query.length - 1];
        const range = section.document.createRange();
        range.setStart(sn, so);
        range.setEnd(en, eo + 1);
        found.push({ cfi: section.cfiFromRange(range), section, parts: snippet(orig, at, query.length) });
        if (hits.length + found.length >= MAX_HITS) { truncated = true; break; }
      }
    } catch (e) {
      console.warn("search: can't read", section.href, e);
    } finally {
      section.unload();
    }
    if (run !== searchRun) return;
    if (found.length) addHits(found);
    if (si % 5 === 4) await new Promise(r => setTimeout(r));   // keep the page responsive
  }
  $("searchStatus").textContent = hits.length
    ? (truncated ? `Showing the first ${MAX_HITS} matches` : "Done")
    : "Nothing found";
  // Start from the first match at or after the current page
  if (hits.length && hitIdx < 0) goToHit(firstHitFromHere());
}

function firstHitFromHere() {
  const loc = rendition.currentLocation();
  const here = loc && loc.start && loc.start.cfi;
  if (!here) return 0;
  const i = hits.findIndex(h => new ePub.CFI().compare(h.cfi, here) >= 0);
  return i < 0 ? 0 : i;
}

function addHits(found) {
  const frag = document.createDocumentFragment();
  const h4 = document.createElement("h4");
  h4.textContent = sectionLabel(found[0].section);
  frag.append(h4);
  for (const hit of found) {
    const i = hits.length;
    hits.push(hit);
    const a = document.createElement("a");
    a.href = "#";
    a.onclick = e => { e.preventDefault(); goToHit(i); if (innerWidth < 900) toggleSearch(false); };
    const small = document.createElement("small");
    const pct = locationsReady ? book.locations.percentageFromCfi(hit.cfi) : null;
    small.textContent = pct != null ? Math.round(pct * 100) + "%" : "";
    const mark = document.createElement("mark");
    mark.textContent = hit.parts[1];
    a.append(small, hit.parts[0], mark, hit.parts[2]);
    hit.a = a;
    frag.append(a);
    try { rendition.annotations.highlight(hit.cfi, {}, () => goToHit(i), "search-hit", HL_STYLE); } catch {}
  }
  $("results").append(frag);
  updateHitUi();
}

function setHighlight(hit, style) {
  try {
    rendition.annotations.remove(hit.cfi, "highlight");
    rendition.annotations.highlight(hit.cfi, {}, () => goToHit(hits.indexOf(hit)), "search-hit", style);
  } catch {}
}

function goToHit(i) {
  if (!hits.length) return;
  i = (i + hits.length) % hits.length;   // wrap around at the ends
  if (hitIdx >= 0 && hits[hitIdx]) { setHighlight(hits[hitIdx], HL_STYLE); hits[hitIdx].a.classList.remove("current"); }
  hitIdx = i;
  const hit = hits[i];
  setHighlight(hit, HL_CURRENT);
  hit.a.classList.add("current");
  scrollToCurrent();
  rendition.display(hit.cfi);
  updateHitUi();
}

// Scroll only the results list (scrollIntoView would also scroll the page under a closed panel)
function scrollToCurrent() {
  const a = hits[hitIdx] && hits[hitIdx].a, box = $("results");
  if (!a || !$("search").classList.contains("open")) return;
  if (a.offsetTop < box.scrollTop + 30 || a.offsetTop + a.offsetHeight > box.scrollTop + box.clientHeight)
    box.scrollTop = a.offsetTop - box.clientHeight / 3;
}

function updateHitUi() {
  const n = hits.length;
  const count = n ? (hitIdx >= 0 ? `${hitIdx + 1} / ${n}` : `${n}`) : "";
  $("hitCount").textContent = n ? count + (n === 1 ? " match" : " matches") : "";
  $("pillCount").textContent = count;
  $("hitPrev").disabled = $("hitNext").disabled = n === 0;
  $("searchPill").classList.toggle("hidden", n === 0 || $("search").classList.contains("open"));
}

function clearSearch(resetInput = true) {
  searchRun++;
  for (const h of hits) try { rendition.annotations.remove(h.cfi, "highlight"); } catch {}
  hits = []; hitIdx = -1; lastQuery = "";
  $("results").replaceChildren();
  $("searchStatus").textContent = "Type a word or phrase and press Enter";
  if (resetInput) $("q").value = "";
  updateHitUi();
}

function toggleSearch(open = !$("search").classList.contains("open")) {
  if (open && !book) return;
  $("search").classList.toggle("open", open);
  $("searchBtn").classList.toggle("active", open);
  if (open) { toggleToc(false); toggleMarks(false); $("q").focus({ preventScroll: true }); $("q").select(); scrollToCurrent(); }
  else $("q").blur();
  updateHitUi();
}

$("searchBtn").onclick = () => toggleSearch();
$("searchClose").onclick = () => toggleSearch(false);
$("searchBar").onsubmit = e => {
  e.preventDefault();
  const q = normQuery($("q").value);
  if (q && q === lastQuery && hits.length) goToHit(hitIdx + 1);   // Enter again = next match
  else runSearch($("q").value);
};
$("q").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); toggleSearch(false); }
  else if (e.key === "Enter" && e.shiftKey) { e.preventDefault(); goToHit(hitIdx - 1); }
});
$("q").addEventListener("input", () => { if (!$("q").value) clearSearch(); });
$("hitPrev").onclick = $("pillPrev").onclick = () => goToHit(hitIdx - 1);
$("hitNext").onclick = $("pillNext").onclick = () => goToHit(hitIdx + 1);
$("pillCount").onclick = () => toggleSearch(true);
$("pillClear").onclick = () => clearSearch();

// ------------------------------------------------------------ bookmarks

// Stored per book in localStorage, sorted by position in the book.
const cfiCmp = (a, b) => new ePub.CFI().compare(a, b);
const saveMarks = () => store.set(marksKey, marks);
const markRows = new Map();   // bookmark -> its row in the list

function here() {
  const loc = rendition && rendition.currentLocation();
  return loc && loc.start && loc.end ? loc : null;
}

// Bookmarks that fall on the page being shown
function marksOnPage(loc = here()) {
  if (!loc) return [];
  return marks.filter(m => cfiCmp(m.cfi, loc.start.cfi) >= 0 && cfiCmp(m.cfi, loc.end.cfi) <= 0);
}

// First words of the page, to recognize the bookmark in the list
function pageText(loc) {
  try {
    const range = rendition.getRange(loc.start.cfi);
    const doc = range.startContainer.ownerDocument;
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
    walker.currentNode = range.startContainer;
    let text = range.startContainer.nodeType === 3 ? range.startContainer.nodeValue.slice(range.startOffset) : "";
    for (let n; text.length < 200 && (n = walker.nextNode()); ) text += " " + n.nodeValue;
    text = text.replace(/\s+/g, " ").trim();
    if (text.length > 120) text = text.slice(0, text.lastIndexOf(" ", 120) > 60 ? text.lastIndexOf(" ", 120) : 120) + "…";
    return text;
  } catch { return ""; }
}

function toggleMarkHere() {
  const loc = here();
  if (!loc) return;
  const onPage = marksOnPage(loc);
  if (onPage.length) marks = marks.filter(m => !onPage.includes(m));
  else {
    marks.push({ cfi: loc.start.cfi, text: pageText(loc), name: "", time: Date.now() });
    marks.sort((a, b) => cfiCmp(a.cfi, b.cfi));
  }
  saveMarks();
  renderMarks();
}

function goToMark(m) {
  rendition.display(m.cfi);
  if (innerWidth < 900) toggleMarks(false);
}

function stepMark(dir) {
  const loc = here();
  if (!loc || !marks.length) return;
  const m = dir > 0 ? marks.find(m => cfiCmp(m.cfi, loc.end.cfi) > 0)
                    : marks.filter(m => cfiCmp(m.cfi, loc.start.cfi) < 0).pop();
  if (m) rendition.display(m.cfi);
}

function markInfo(m) {
  const pct = locationsReady ? book.locations.percentageFromCfi(m.cfi) : null;
  return [pct != null ? Math.round(pct * 100) + "%" : "", chapterAt(m.cfi)].filter(Boolean).join(" · ");
}

function renderMarks() {
  const list = $("markList");
  list.replaceChildren();
  markRows.clear();
  if (!marks.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No bookmarks yet. Press ☆ (or M) to bookmark the page you are reading.";
    list.append(p);
  }
  for (const m of marks) {
    const row = document.createElement("div");
    row.className = "mark";
    const a = document.createElement("a");
    a.href = "#";
    a.onclick = e => { e.preventDefault(); goToMark(m); };
    const small = document.createElement("small");
    small.textContent = markInfo(m);
    const span = document.createElement("span");
    span.textContent = m.name || m.text || "(no text)";
    span.title = m.text;
    if (m.name) span.className = "named";
    a.append(small, span);
    const edit = document.createElement("button");
    edit.append(icon("edit"));
    edit.title = "Rename";
    edit.onclick = () => renameMark(m, a, span);
    const del = document.createElement("button");
    del.append(icon("trash"));
    del.title = "Delete bookmark";
    del.onclick = () => { marks = marks.filter(x => x !== m); saveMarks(); renderMarks(); };
    row.append(a, edit, del);
    markRows.set(m, row);
    list.append(row);
  }
  updateMarkUi();
}

function renameMark(m, a, span) {
  const input = document.createElement("input");
  input.value = m.name;
  input.placeholder = m.text.slice(0, 60) || "Bookmark name";
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    if (save) { m.name = input.value.trim(); saveMarks(); }
    renderMarks();
  };
  input.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Enter") finish(true);
    else if (e.key === "Escape") finish(false);
  };
  input.onblur = () => finish(true);
  span.replaceWith(input);
  a.onclick = e => e.preventDefault();
  input.focus({ preventScroll: true });
}

function updateMarkUi() {
  const loc = here();
  const onPage = marksOnPage(loc);
  $("markBtn").classList.toggle("on", onPage.length > 0);
  $("marksBtn").disabled = !marks.length;   // the list opens only when there is something in it
  $("markBtn").title = onPage.length ? "Remove bookmark from this page (M)" : "Bookmark this page (M)";
  for (const [m, row] of markRows) row.classList.toggle("current", onPage.includes(m));
  $("markPrev").disabled = !loc || !marks.some(m => cfiCmp(m.cfi, loc.start.cfi) < 0);
  $("markNext").disabled = !loc || !marks.some(m => cfiCmp(m.cfi, loc.end.cfi) > 0);
}

function toggleMarks(open = !$("marks").classList.contains("open")) {
  if (open && (!book || !marks.length)) return;
  $("marks").classList.toggle("open", open);
  $("marksBtn").classList.toggle("active", open);
  if (open) {
    toggleToc(false); toggleSearch(false);
    const cur = $("markList").querySelector(".current");
    if (cur) $("markList").scrollTop = cur.offsetTop - $("markList").clientHeight / 3;
  }
}

$("markBtn").onclick = () => toggleMarkHere();
$("marksBtn").onclick = () => toggleMarks();
$("marksClose").onclick = () => toggleMarks(false);
$("markPrev").onclick = () => stepMark(-1);
$("markNext").onclick = () => stepMark(1);

// ------------------------------------------------------------ leaving the book

// Esc peels one layer at a time: an open panel, then search highlights, then the book itself
function escape() {
  if (["toc", "search", "marks"].some(id => $(id).classList.contains("open"))) {
    toggleToc(false); toggleSearch(false); toggleMarks(false);
  } else if (hits.length) {
    clearSearch();
  } else if (!$("back").classList.contains("hidden")) {
    backToCatalog();
  }
}

// Came from the catalog: go back in history, so it keeps its scroll position and search
function backToCatalog() {
  const catalog = new URL($("back").href);
  let fromCatalog = false;
  try { fromCatalog = new URL(document.referrer).pathname === catalog.pathname; } catch {}
  if (fromCatalog && history.length > 1) history.back();
  else location.href = catalog.href;
}
$("back").addEventListener("click", e => { e.preventDefault(); backToCatalog(); });

// ------------------------------------------------------------ controls

let touchX = 0;
function onKey(e) {
  if (!rendition) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === "f" || k === "F" || k === "а" || k === "А")) {
    e.preventDefault(); toggleSearch(true); return;
  }
  if (k === "F3") { e.preventDefault(); goToHit(hitIdx + (e.shiftKey ? -1 : 1)); return; }
  // Let text fields (search, bookmark name) have their keys; the slider is not one of them,
  // otherwise after a click on it Esc and the arrows stop working for the book
  const t = e.target;
  if ((t.tagName === "INPUT" && t.type !== "range") || t.tagName === "TEXTAREA") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === "ArrowRight" || k === "PageDown" || (k === " " && !e.shiftKey)) { e.preventDefault(); rendition.next(); }
  else if (k === "ArrowLeft" || k === "PageUp" || (k === " " && e.shiftKey)) { e.preventDefault(); rendition.prev(); }
  else if (k === "t" || k === "T" || k === "е" || k === "Е") toggleToc();
  else if (k === "Escape") { e.preventDefault(); escape(); }
  else if (k === "m" || k === "M" || k === "ь" || k === "Ь") toggleMarkHere();
  else if (k === "b" || k === "B" || k === "и" || k === "И") toggleMarks();
  else if (k === "[" || k === "х" || k === "Х") stepMark(-1);
  else if (k === "]" || k === "ъ" || k === "Ъ") stepMark(1);
  else if (k === "/") { e.preventDefault(); toggleSearch(true); }
  else if (k === "+" || k === "=") setFont(10);
  else if (k === "-") setFont(-10);
}
document.addEventListener("keydown", onKey);

function setFont(delta) {
  prefs.font = Math.min(200, Math.max(60, prefs.font + delta));
  savePrefs();
  if (rendition) rendition.themes.fontSize(prefs.font + "%");
}

$("prev").onclick = () => rendition.prev();
$("next").onclick = () => rendition.next();
$("tocBtn").onclick = () => toggleToc();
$("smaller").onclick = () => setFont(-10);
$("bigger").onclick = () => setFont(10);
$("themeBtn").onclick = () => {
  prefs.theme = THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length];
  savePrefs();
  document.documentElement.dataset.theme = prefs.theme;
  if (rendition) rendition.themes.select(prefs.theme);
};
$("pickBtn").onclick = $("openBtn").onclick = () => $("file").click();
$("file").onchange = e => { openFile(e.target.files[0]); e.target.value = ""; };
$("stage").addEventListener("click", e => {
  if ($("toc").classList.contains("open") && !$("toc").contains(e.target) ) toggleToc(false);
});

// Drag & drop a file anywhere on the page
document.addEventListener("dragover", e => { e.preventDefault(); $("start").classList.add("drag"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $("start").classList.remove("drag"); });
document.addEventListener("drop", e => {
  e.preventDefault();
  $("start").classList.remove("drag");
  openFile(e.dataTransfer.files[0]);
});
</script>
